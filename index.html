<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Family Gym</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <button id="back" class="iconbtn" aria-label="Back" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <h1 id="title">Family Gym</h1>
    <button id="sync" class="sync" aria-label="Sync status"></button>
  </header>
  <main id="app"><div class="card center">Loading…</div></main>
  <div id="timer" class="timer" hidden>
    <span>Rest</span><b id="timer-t">0:00</b>
    <button id="timer-add" class="ghost">+30s</button><button id="timer-skip" class="ghost">Skip</button>
  </div>
  <div id="toast" class="toast" hidden></div>
  <nav id="nav" hidden></nav>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
