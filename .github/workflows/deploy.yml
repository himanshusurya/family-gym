name: Validate & deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate plans (a broken plan never reaches the phones)
        run: node tools/validate.mjs
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html app.js styles.css sw.js config.js manifest.webmanifest version.json icons plans exercises media _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: dep
        uses: actions/deploy-pages@v4
